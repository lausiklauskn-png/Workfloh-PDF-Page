const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const FONT = '"Inter","DejaVu Sans",sans-serif';

/* ── Hilfen ── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, x) => a + (b - a) * x;
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }   // fester Zufall
function font(px, w = 700) { g.font = `${w} ${px}px ${FONT}`; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function fitText(s, max, px, w = 700) { font(px, w); while (g.measureText(s).width > max && px > 10) { px -= 1; font(px, w); } return px; }
function wrap(s, max) { const out = []; let z = ''; for (const w of s.split(' ')) { const n = z ? z + ' ' + w : w; if (g.measureText(n).width > max && z) { out.push(z); z = w; } else z = n; } if (z) out.push(z); return out; }
/* Entschlüsseln: Zeichen laufen durch Zufallszeichen, bis sie stehen */
const GLYPH = 'ABCDEFGHKLMNPRSTUVXYZ0123456789#$%&@*+=<>/';
function decode(s, p, seed) { let o = ''; for (let i = 0; i < s.length; i++) { const fix = (i / s.length) * .7 + .3 * rnd(seed + i); o += (p >= fix || s[i] === ' ') ? s[i] : GLYPH[Math.floor(rnd(seed + i * 7 + Math.floor(p * 40)) * GLYPH.length)]; } return o; }

/* Bilder */
const IMG = {};
function lade(name, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[name] = i; r(); }; i.onerror = () => r(); i.src = src; }); }

/* Bühne: wo die Grafik steht und wo die Beschriftung */
const B = HOCH ? { cx: 540, cy: 860, w: 940, h: 1060, capY: 1500 } : { cx: 960, cy: 470, w: 1180, h: 640, capY: 905 };

/* ── Hintergrund: dunkel, ein Raster das atmet, Funken ── */
function hintergrund(t) {
  const gr = g.createRadialGradient(W * .5, H * .42, 50, W * .5, H * .5, Math.max(W, H) * .75);
  gr.addColorStop(0, '#1b2140'); gr.addColorStop(.55, '#0f1328'); gr.addColorStop(1, '#070912');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // Raster mit Perspektive
  g.save(); g.globalAlpha = .18; g.strokeStyle = '#3c4a8a'; g.lineWidth = 1;
  const off = (t * 40) % 80;
  for (let x = -W; x < W * 2; x += 80) { g.beginPath(); g.moveTo(W / 2 + (x - W / 2) * .35, H * .55); g.lineTo(x, H); g.stroke(); }
  for (let i = 0; i < 12; i++) { const y = H * .55 + Math.pow((i * 80 + off) / 960, 2) * H * .45 * 2.2; if (y > H) break; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore();
  // Funken
  for (let i = 0; i < 46; i++) {
    const sp = .2 + rnd(i) * .6, x = rnd(i + 99) * W + Math.sin(t * sp + i) * 30, y = (rnd(i + 7) * H - t * 30 * sp + H * 4) % H;
    g.fillStyle = i % 5 ? 'rgba(130,160,255,' + (.15 + .3 * rnd(i + 3)) + ')' : 'rgba(224,35,27,.55)';
    g.beginPath(); g.arc(x, y, 1 + rnd(i + 5) * 2.2, 0, 7); g.fill();
  }
}

/* Schild mit Haken, Strich wird gezeichnet (p 0..1) */
function schild(cx, cy, s, p, glow) {
  g.save(); g.translate(cx, cy); g.scale(s, s);
  const pfad = new Path2D('M0,-100 L80,-70 L80,10 C80,60 40,95 0,115 C-40,95 -80,60 -80,10 L-80,-70 Z');
  g.shadowColor = ROT; g.shadowBlur = 40 * glow;
  g.fillStyle = `rgba(224,35,27,${.9 * clamp(p * 1.4 - .4)})`; g.fill(pfad);
  g.lineWidth = 8; g.strokeStyle = '#fff'; g.setLineDash([700]); g.lineDashOffset = 700 * (1 - p); g.stroke(pfad);
  g.setLineDash([]); g.shadowBlur = 0;
  const h = clamp(p * 2 - 1);
  if (h > 0) { g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#fff'; g.setLineDash([180]); g.lineDashOffset = 180 * (1 - h);
    g.beginPath(); g.moveTo(-38, 8); g.lineTo(-10, 38); g.lineTo(42, -28); g.stroke(); g.setLineDash([]); }
  g.restore();
}

/* Beschriftung der Szene: Titel springt hoch, Unterzeile blendet ein */
function caption(t, a, b, titel, unter) {
  const ein = eOut(lin(t, a, a + .55)), aus = lin(t, b - .4, b);
  if (ein <= 0 || aus >= 1) return;
  g.save(); g.globalAlpha = (1 - aus);
  const maxW = HOCH ? 980 : 1500;
  const px = fitText(titel, maxW, HOCH ? 74 : 72, 800);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const y = B.capY + (1 - ein) * 50 - aus * 30;
  const tw = g.measureText(titel).width;
  // roter Balken wischt durch
  const bal = eInOut(lin(t, a, a + .5));
  g.fillStyle = ROT; g.fillRect(W / 2 - tw / 2 - 30, y + px * .62, (tw + 60) * bal, 8);
  g.fillStyle = '#fff'; g.globalAlpha = (1 - aus) * ein; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 20;
  g.fillText(titel, W / 2, y);
  g.shadowBlur = 0;
  if (unter) {
    const u = eOut(lin(t, a + .35, a + .9));
    g.globalAlpha = (1 - aus) * u;
    const p2 = HOCH ? 40 : 34; font(p2, 500); g.fillStyle = '#c7d0f0';
    const zeilen = HOCH ? wrap(unter, 960) : [unter];
    zeilen.forEach((z, i) => g.fillText(z, W / 2, y + px * .62 + 50 + i * (p2 * 1.3) + (1 - u) * 16));
  }
  g.restore();
}

/* Warnschild (Stempel) */
function stempel(x, y, text, p, px = 30) {
  if (p <= 0) return;
  const s = p < 1 ? mix(2.4, 1, eBack(p)) : 1;
  font(px, 800); const w0 = g.measureText(text).width + 44; x = clamp(x, w0 / 2 + 44, W - w0 / 2 - 44);   // nie über den Rand
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(-.04); g.globalAlpha = clamp(p * 3);
  font(px, 800); const w = g.measureText(text).width + 44;
  g.shadowColor = ROT; g.shadowBlur = 30;
  rr(-w / 2, -px * .95, w, px * 1.9, 14); g.fillStyle = ROT; g.fill();
  g.shadowBlur = 0; g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 0, 2);
  g.restore();
}

/* ── SZENE 0 · Titel (0 – 3,4) ── */
function szene0(t) {
  const aus = eInOut(lin(t, 4.2, 4.7));
  if (aus >= 1) return;
  g.save(); g.globalAlpha = 1 - aus;
  const z = 1 + aus * .6; g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
  // Ringe
  for (let i = 0; i < 3; i++) { const r = ((t * 260 + i * 220) % 700); g.strokeStyle = `rgba(224,35,27,${.5 * (1 - r / 700)})`; g.lineWidth = 4; g.beginPath(); g.arc(W / 2, HOCH ? 640 : 330, r, 0, 7); g.stroke(); }
  schild(W / 2, HOCH ? 640 : 330, HOCH ? 1.5 : 1.15, eInOut(lin(t, .1, 1.3)), .5 + .5 * Math.sin(t * 4));
  // NEU
  stempel(W / 2 + (HOCH ? 170 : 140), (HOCH ? 640 : 330) - (HOCH ? 160 : 125), TX.neu, lin(t, 1.0, 1.35), HOCH ? 40 : 34);
  // Titel Wort für Wort
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const zeile = TX.titel.join(' ');
  let px = fitText(zeile, HOCH ? 960 : 1700, HOCH ? 96 : 110, 900);
  const zeilen = HOCH ? TX.titel : [zeile];
  if (HOCH) px = Math.min(...TX.titel.map(w => fitText(w, 960, 130, 900))), font(px, 900);
  const y0 = HOCH ? 960 : 640;
  let wi = 0;
  zeilen.forEach((z, zi) => {
    const woerter = HOCH ? [z] : z.split(' ');
    const ges = g.measureText(z).width; let x = W / 2 - ges / 2;
    woerter.forEach((w, i) => {
      const ww = g.measureText(w).width, k = wi++;
      const p = eOut(lin(t, .7 + k * .22, 1.25 + k * .22));
      g.save(); g.globalAlpha = p; g.translate(x + ww / 2, y0 + zi * px * 1.08 + (1 - p) * 80); g.scale(mix(.6, 1, p), mix(.6, 1, p));
      g.fillStyle = k === (HOCH ? 1 : TX.titel.length - 2) ? ROT : '#fff'; g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 24;
      g.fillText(w, 0, 0); g.restore();
      x += ww + g.measureText(' ').width;
    });
  });
  const u = eOut(lin(t, 1.7, 2.3));
  g.globalAlpha = (1 - aus) * u; font(HOCH ? 42 : 40, 500); g.fillStyle = '#c7d0f0';
  const uz = HOCH ? wrap(TX.unter, 940) : [TX.unter];
  uz.forEach((z, i) => g.fillText(z, W / 2, y0 + (HOCH ? 3 : 1) * px * 1.08 + 30 + i * 56 + (1 - u) * 20));
  g.restore();
}

   Klaus 2026-10-06: „deutlich zu erkennen, welche Methoden die Gangster anwenden, damit KI getäuscht wird". ── */

   bei 16 s, pulsierend 30–47 s, zweiter Höhepunkt bei 48 s, Ausklang ab 66 s). */
const ZT = { a: 4.5, b: 10.6 };                      // der Täter versteckt den Befehl in einer Rechnung
const ZW = { a: 10.5, b: 16.1 };                     // die Datei kommt per E-Mail, man gibt sie einer KI
const ZK = { a: 16.0, b: 22.1 };                     // Höhepunkt: die KI gehorcht dem Täter
const Z1 = { a0: 22.0, A: 24.6, b: 30.1 };           // Trick 1 · unsichtbarer Text im PDF
const Z2 = { a0: 30.0, A: 32.8, b: 38.4 };           // Trick 2 · blasse Schrift im Foto
const Z3 = { a0: 38.3, A: 41.1, b: 47.9 };           // Trick 3 · Befehl in den Bildpunkten
const ZS = { a: 47.8, b: 56.2 };                     // zweiter Höhepunkt: mit Workfloh PDF fällt es auf
const Z4 = { a: 56.1, b: 63.4 };                     // alle erkannt
const Z5 = { a: 63.3 };                              // Schluss
