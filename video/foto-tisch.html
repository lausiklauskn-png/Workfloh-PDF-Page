<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:1600px;height:1200px;overflow:hidden}
body{background:
  radial-gradient(ellipse at 30% 20%,rgba(255,240,215,.55),transparent 60%),
  repeating-linear-gradient(92deg,#8a5a34 0 14px,#935f37 14px 22px,#80522f 22px 40px,#8f5d35 40px 61px),
  #8a5a34;perspective:1700px}
#blatt{position:absolute;left:50%;top:50%;width:640px;transform-origin:50% 50%;
  transform:translate(-50%,-50%) rotateX(24deg) rotateZ(-7deg) rotateY(-5deg);
  box-shadow:18px 30px 38px rgba(0,0,0,.45),0 0 2px rgba(0,0,0,.4);background:#fff}
#blatt canvas{display:block;width:100%}
#licht{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 40%,rgba(0,0,0,.18));pointer-events:none}
#stift{position:absolute;left:60px;top:1010px;width:360px;height:22px;transform:rotate(-28deg);filter:drop-shadow(7px 11px 7px rgba(0,0,0,.45))}
#stift .spitze{position:absolute;left:0;top:3px;width:34px;height:16px;clip-path:polygon(0 50%,100% 0,100% 100%);background:linear-gradient(#e8e8ea,#9a9ca3 55%,#6d6f75)}
#stift .mine{position:absolute;left:-3px;top:10px;width:5px;height:2px;background:#222;border-radius:1px}
#stift .griff{position:absolute;left:32px;top:1px;width:78px;height:20px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 6px),linear-gradient(#3a3d44,#16181c 60%,#2a2c31)}
#stift .schaft{position:absolute;left:108px;top:0;width:236px;height:22px;border-radius:2px 11px 11px 2px;background:linear-gradient(#5a7cf0,#2b4fd0 35%,#1a318f 80%,#2a44b8)}
#stift .ring{position:absolute;left:300px;top:0;width:10px;height:22px;background:linear-gradient(#f2f2f4,#a9abb2 55%,#7c7e85)}
#stift .clip{position:absolute;left:228px;top:-4px;width:100px;height:6px;border-radius:3px;background:linear-gradient(#f4f4f6,#9ea0a7);box-shadow:0 2px 2px rgba(0,0,0,.35)}
</style>
<div id="blatt"><canvas id="c"></canvas></div><div id="stift"><div class="spitze"></div><div class="mine"></div><div class="griff"></div><div class="schaft"></div><div class="ring"></div><div class="clip"></div></div><div id="licht"></div>
<script src="/app/vendor/pdfjs/pdf.min.js"></script>
<script>
(async()=>{
  pdfjsLib.GlobalWorkerOptions.workerSrc='/app/vendor/pdfjs/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument('/app/beispiele/Beispiel-Amtsformular-Bewohnerparkausweis.pdf').promise;
  const s=await doc.getPage(1); const v=s.getViewport({scale:2.2});
  const c=document.getElementById('c'); c.width=v.width; c.height=v.height;
  await s.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
  window.__fertig=true;
})();
</script>
